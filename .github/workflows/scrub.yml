name: Check reports

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: scrub-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The issue text is read from the event file inside the script, never interpolated
      # into a shell command.
      - run: python3 scripts/scrub.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
